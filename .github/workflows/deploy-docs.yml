name: Deploy VitePress docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'results/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build summary + sync results/ to docs/public/api/
        run: |
          mkdir -p docs/public/api/cells
          python3 <<'PY'
          import json, os, glob, time

          def scrub(o):
              if isinstance(o, dict):
                  if 'host' in o and isinstance(o['host'], str):
                      o['host'] = 'shared-cpu-host'
                  for v in o.values():
                      scrub(v)
              elif isinstance(o, list):
                  for v in o:
                      scrub(v)

          cells = []
          for f in sorted(glob.glob('results/*.json')):
              name = os.path.basename(f)
              if name in ('summary.json', 'results.json'): continue
              if name.endswith('.harness') or name.endswith('.bench.json'): continue
              try:
                  with open(f) as fp:
                      d = json.load(fp)
              except Exception as exc:
                  print(f'skipping {name}: {exc}')
                  continue
              scrub(d)
              # only treat as a cell if it has a cell_id (skip ancillary files
              # like build-status.json, etc.)
              if not isinstance(d, dict) or 'cell_id' not in d:
                  with open(f'docs/public/api/cells/{name}', 'w') as fp:
                      json.dump(d, fp, indent=2)
                  print(f'  ancillary: {name} (no cell_id)')
                  continue
              with open(f'docs/public/api/cells/{name}', 'w') as fp:
                  json.dump(d, fp, indent=2)
              cells.append(d)

          def row(c):
              return {
                  'cell_id': c.get('cell_id'),
                  'model_id': c.get('model_id'),
                  'weight_quant': c.get('weight_quant'),
                  'kv_quant': c.get('kv_quant'),
                  'gen_eval_tps': (c.get('throughput') or {}).get('gen_eval_tps'),
                  'prompt_eval_tps': (c.get('throughput') or {}).get('prompt_eval_tps'),
                  'p50_ms': (c.get('latency_ms') or {}).get('p50'),
                  'p95_ms': (c.get('latency_ms') or {}).get('p95'),
                  'overall_pass': (c.get('tool_calling') or {}).get('overall_pass'),
                  'format_pass_rate': (c.get('tool_calling') or {}).get('format_pass_rate'),
                  'n_cases': c.get('n_cases'),
                  'status': c.get('status', 'complete'),
                  'skip_reason': c.get('skip_reason'),
              }

          # Split into complete vs skipped/failed for cleaner rendering
          complete_cells = [c for c in cells if c.get('status') != 'skipped' and (c.get('tool_calling') or {}).get('overall_pass') is not None]
          skipped_cells = [c for c in cells if c.get('status') == 'skipped' or (c.get('tool_calling') or {}).get('overall_pass') is None]

          summary = {
              'generated_at': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
              'host': 'shared-cpu-host',
              'n_cells': len(complete_cells),
              'n_skipped': len(skipped_cells),
              'cells': [row(c) for c in complete_cells],
              'skipped': [row(c) for c in skipped_cells],
              'full': cells,
          }

          if not cells:
              summary = {'status': 'pending', 'cells': []}

          with open('docs/public/api/summary.json', 'w') as fp:
              json.dump(summary, fp, indent=2)
          with open('docs/public/api/results.json', 'w') as fp:
              json.dump(summary, fp, indent=2)

          print(f'built summary with {len(cells)} cells')
          for c in cells:
              print(f'  - {c.get("cell_id")}: {(c.get("tool_calling") or {}).get("overall_pass")}% / {(c.get("throughput") or {}).get("gen_eval_tps")} tok/s')
          PY
          ls -R docs/public/api/
      - run: pnpm run docs:build
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
