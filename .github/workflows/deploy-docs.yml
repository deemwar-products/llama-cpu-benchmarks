name: Deploy VitePress docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'results/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sync results/ to docs/public/api/
        run: |
          mkdir -p docs/public/api/cells
          if [ -f results/summary.json ]; then
            cp results/summary.json docs/public/api/summary.json
            cp results/summary.json docs/public/api/results.json
          else
            echo '{"status":"pending","cells":[]}' > docs/public/api/summary.json
            cp docs/public/api/summary.json docs/public/api/results.json
          fi
          if ls results/*.json >/dev/null 2>&1; then
            for f in results/*.json; do
              name=$(basename "$f")
              [ "$name" != "summary.json" ] && cp "$f" "docs/public/api/cells/$name" || true
            done
          fi
          ls -R docs/public/api/
      - run: pnpm run docs:build
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
